sentence=Filter berbahasa Indonesia untuk meredam noise sensor: rata-rata bergerak, median, EMA, dan Kalman 1D.
paragraph=Satu pola untuk semua filter: float halus = filter.saring(bacaan). Tanpa alokasi dinamis, benar sejak sampel pertama, rata-rata bergerak tanpa drift, median efisien tanpa sort penuh, EMA dari waktu respon, Kalman dengan noise dalam satuan sensor, dan bacaan NAN diabaikan. Bekerja di AVR, ESP32, dan STM32. English: sensor filter, moving average, running median, spike rejection, exponential moving average, EMA, Kalman filter, smoothing, noise.
